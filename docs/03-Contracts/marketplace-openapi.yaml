        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
