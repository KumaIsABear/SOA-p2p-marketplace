openapi: 3.1.0
info:
  title: In-game Marketplace - REST API Contracts
  version: 1.0.0
  description: Proposed baseline; five microservices via YARP. Internal routes require per-caller credential and
    correct internal origin. See plain-text companion for state and event contracts.
servers:
- url: http://localhost:8080
  description: Local YARP (public routes only)
tags:
- name: Auth
- name: Wallet
- name: Inventory
- name: Marketplace
- name: Admin
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: AUTH-01 login
      operationId: AUTH_01
      description: Đăng nhập bằng mật khẩu cho tài khoản đã seed; không public register.
      x-fr: AUTH-01
      x-access: Anonymous
      security: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '500':
          description: Unexpected error — INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Dependency unavailable or result unknown — DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Invalid request — VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication failed — INVALID_CREDENTIALS
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden — ACCOUNT_BANNED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too many requests — RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/google:
    post:
      tags:
      - Auth
      summary: AUTH-02 google
      operationId: AUTH_02
      description: Xác minh Google ID token, lấy subject; tạo Player nếu chưa có. Không tự gán GM/CS hoặc liên kết
        theo email.
      x-fr: AUTH-01 + Google
      x-access: Anonymous
      security: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '500':
          description: Unexpected error — INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Dependency unavailable or result unknown — DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Invalid request — VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication failed — INVALID_GOOGLE_TOKEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden — ACCOUNT_BANNED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict — IDENTITY_CONFLICT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too many requests — RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: AUTH-03 refresh
      operationId: AUTH_03
      description: Rotate refresh token atomically; chỉ hash lưu DB, token cũ revoked.
      x-fr: AUTH-02
      x-access: Anonymous
      security: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '500':
          description: Unexpected error — INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Dependency unavailable or result unknown — DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Invalid request — VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication failed — INVALID_REFRESH_TOKEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden — ACCOUNT_BANNED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too many requests — RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: AUTH-04 logout
      operationId: AUTH_04
      description: Revoke refresh token nếu tồn tại; trả 204 cả khi đã revoke/không tồn tại. Access token hết hạn
        tự nhiên; ban check vẫn áp dụng.
      x-fr: AUTH-02
      x-access: RefreshToken
      security: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: No Content
        '500':
          description: Unexpected error — INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Dependency unavailable or result unknown — DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Invalid request — VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: AUTH-05 me
      operationId: AUTH_05
      description: Trả user theo JWT sub; không nhận userId từ client.
      x-fr: AUTH-01
      x-access: Player|GM|CS
      security:
      - BearerAuth: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Authentication failed — UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden — FORBIDDEN, ACCOUNT_BANNED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Unexpected error — INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Dependency unavailable or result unknown — DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/auth/users/{userId}/status:
    get:
      tags:
      - Auth
      summary: AUTH-I01 status
      operationId: AUTH_I01
      description: Nguồn chuẩn status + role. Gateway fail closed nếu Auth lỗi; Marketplace kiểm lại trước lệnh
        thay đổi.
      x-fr: AUTH-04
      x-access: Service:gateway,marketplace,admin
      security:
      - ServiceKey: []
      servers:
      - url: http://auth-api:8080
        description: Private Docker network only
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessStatus'
        '401':
          description: Authentication failed — UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden — FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Unexpected error — INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Dependency unavailable or result unknown — DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Resource not found — USER_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      tags:
      - Auth
      summary: AUTH-I02 status
      operationId: AUTH_I02
      description: Chỉ sửa tài khoản Player; operationId idempotent, không cấp role, revoke refresh nếu Banned.
      x-fr: CS-02,AUTH-04
      x-access: Service:admin
      security:
      - ServiceKey: []
      servers:
      - url: http://auth-api:8080
        description: Private Docker network only
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalModerationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessStatus'
        '401':
          description: Authentication failed — UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden — FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Unexpected error — INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Dependency unavailable or result unknown — DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Invalid request — VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Resource not found — USER_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict — IDEMPOTENCY_CONFLICT, INVALID_ACCOUNT_TARGET
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/wallet/balance:
    get:
      tags:
      - Wallet
      summary: WAL-01 balance
      operationId: WAL_01
      description: Ví theo sub; khởi tạo ví rỗng idempotent khi cần.
      x-fr: WAL-01
      x-access: Player
      security:
      - BearerAuth: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '401':
          description: Authentication failed — UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden — FORBIDDEN, ACCOUNT_BANNED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Unexpected error — INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Dependency unavailable or result unknown — DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/wallet/transactions:
    get:
      tags:
      - Wallet
      summary: WAL-02 transactions
      operationId: WAL_02
      description: Ledger cá nhân, mới nhất trước.
      x-fr: WAL-01,QRY-04
      x-access: Player
      security:
      - BearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 20
          maximum: 100
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - TopUp
          - Hold
          - SettlementDebit
          - SettlementCredit
          - Release
          - TaxBurn
      - name: tradeId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionPage'
        '401':
          description: Authentication failed — UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden — FORBIDDEN, ACCOUNT_BANNED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Unexpected error — INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Dependency unavailable or result unknown — DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Invalid request — VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/wallet/top-up-packages:
    get:
      tags:
      - Wallet
      summary: WAL-03 top-up-packages
      operationId: WAL_03
      description: Gói nạp từ cấu hình server; không nhận tỷ giá client.
      x-fr: WAL-02
      x-access: Player
      security:
      - BearerAuth: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpPackages'
        '401':
          description: Authentication failed — UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden — FORBIDDEN, ACCOUNT_BANNED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Unexpected error — INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Dependency unavailable or result unknown — DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/wallet/top-ups:
    post:
      tags:
      - Wallet
      summary: WAL-04 top-ups
      operationId: WAL_04
      description: 201 khi nhận URL; 202 nếu đã lưu Pending nhưng kết quả create chưa rõ, không tạo đơn mới mù.
        Location trỏ order. TradeRestricted vẫn được xem/nạp theo quyết định đề xuất.
      x-fr: WAL-02
      x-access: Player
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTopUpRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpOrder'
          headers:
            Location:
              description: Status or resource URI (where applicable)
              schema:
                type: string
        '202':
          description: Accepted; processing not complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpOrder'
          headers:
            Location:
              description: Status or resource URI (where applicable)
              schema:
                type: string
        '401':
          description: Authentication failed — UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden — FORBIDDEN, ACCOUNT_BANNED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Unexpected error — INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Dependency unavailable or result unknown — DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Invalid request — VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Resource not found — PACKAGE_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict — IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Provider returned rejection or bad response — PAYMENT_CREATE_REJECTED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/wallet/top-ups/{topUpId}:
    get:
      tags:
      - Wallet
      summary: WAL-05 {topUpId}
      operationId: WAL_05
      description: SQL authoritative, chỉ chủ đơn; query ZaloPay do job, không gọi provider mỗi lần poll.
      x-fr: WAL-02,WAL-03
      x-access: Player
      security:
      - BearerAuth: []
      parameters:
      - name: topUpId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpOrder'
        '401':
          description: Authentication failed — UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden — FORBIDDEN, ACCOUNT_BANNED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Unexpected error — INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Dependency unavailable or result unknown — DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Resource not found — TOPUP_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/wallet/zalopay/callback:
    post:
      tags:
      - Wallet
      summary: WAL-06 callback
      operationId: WAL_06
      description: Body provider-specific; verify MAC Key2 trên nguyên chuỗi data; local tx cộng ví, ledger và Paid;
        không cần JWT. 200 + mã provider kể cả invalid MAC/duplicate/retry; 400 chỉ khi HTTP body không parse được.
      x-fr: WAL-03
      x-access: ZaloPayMAC
      security: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZaloPayCallbackRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZaloPayCallbackResponse'
        '400':
          description: Invalid request — VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /internal/v1/wallet/trades/{tradeId}/trace:
    get:
      tags:
      - Wallet
      summary: WAL-I01 trace
      operationId: WAL_I01
      description: Trả hold nullable và ledger [] nếu bước chưa chạy; trạng thái có thể dùng để đối soát Saga.
      x-fr: CS-01,WAL-04,WAL-05,WAL-06
      x-access: Service:admin,marketplace
      security:
      - ServiceKey: []
      servers:
      - url: http://wallet-api:8080
        description: Private Docker network only
      parameters:
      - name: tradeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTradeTrace'
        '401':
          description: Authentication failed — UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden — FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Unexpected error — INTERNAL_ERROR
          content:
