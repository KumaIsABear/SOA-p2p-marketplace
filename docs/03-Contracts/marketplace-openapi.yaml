components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ServiceKey:
      type: apiKey
      in: header
      name: X-Service-Key
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        traceId:
          type: string
          minLength: 1
        errors:
          type: array
          items:
            type: string
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - traceId
      description: Lỗi REST; errors là danh sách lỗi validation, không chứa secret.
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    GoogleLoginRequest:
      type: object
      properties:
        idToken:
          type: string
          minLength: 1
          description: Google credential ID token
        nonce:
          type: string
          minLength: 1
          description: chỉ nếu đã thiết lập challenge phía server
      required:
      - idToken
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
    User:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
        role:
          type: string
          enum:
          - Player
          - GM
          - CS
        status:
          type: string
          enum:
          - Active
          - TradeRestricted
          - Banned
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - userId
      - email
      - displayName
      - role
      - status
      - version
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          minLength: 1
        refreshToken:
          type: string
          minLength: 1
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          format: int32
          minimum: 1
