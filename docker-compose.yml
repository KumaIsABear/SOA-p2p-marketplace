services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?SQL_SA_PASSWORD must be set in .env}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - marketplace-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?SQL_SA_PASSWORD must be set in .env}"
      AUTH_DB_PASSWORD: "${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set in .env}"
      WALLET_DB_PASSWORD: "${WALLET_DB_PASSWORD:?WALLET_DB_PASSWORD must be set in .env}"
      INVENTORY_DB_PASSWORD: "${INVENTORY_DB_PASSWORD:?INVENTORY_DB_PASSWORD must be set in .env}"
      MARKETPLACE_DB_PASSWORD: "${MARKETPLACE_DB_PASSWORD:?MARKETPLACE_DB_PASSWORD must be set in .env}"
      ADMIN_DB_PASSWORD: "${ADMIN_DB_PASSWORD:?ADMIN_DB_PASSWORD must be set in .env}"
    volumes:
      - ./infrastructure/sql/init-databases.sql:/init/init-databases.sql:ro
    entrypoint:
      - /bin/bash
      - -euo
      - pipefail
      - -c
      - |
        SQLCMDPASSWORD="$$SQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver,1433 -U sa -C -b \
          -v AUTH_DB_PASSWORD="$$AUTH_DB_PASSWORD" \
          -v WALLET_DB_PASSWORD="$$WALLET_DB_PASSWORD" \
          -v INVENTORY_DB_PASSWORD="$$INVENTORY_DB_PASSWORD" \
          -v MARKETPLACE_DB_PASSWORD="$$MARKETPLACE_DB_PASSWORD" \
          -v ADMIN_DB_PASSWORD="$$ADMIN_DB_PASSWORD" \
          -i /init/init-databases.sql
    networks:
      - marketplace-network

  mongodb:
    image: mongo:8.0-noble
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in .env}"
      MONGO_INITDB_DATABASE: "MarketplaceReadDb"
      MONGO_MARKETPLACE_PASSWORD: "${MONGO_MARKETPLACE_PASSWORD:?MONGO_MARKETPLACE_PASSWORD must be set in .env}"
    volumes:
      - mongodb-data:/data/db
      - ./infrastructure/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/01-init-mongo.js:ro
    networks:
      - marketplace-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok" | grep -q 1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"
    command:
      - /bin/sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis-data:/data
    networks:
      - marketplace-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "rabbitmq_admin"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_BOOTSTRAP_PASSWORD:?RABBITMQ_BOOTSTRAP_PASSWORD must be set in .env}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - marketplace-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity'
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  rabbitmq-init:
    image: alpine:3.21
    restart: "no"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_BOOTSTRAP_PASSWORD: "${RABBITMQ_BOOTSTRAP_PASSWORD:?RABBITMQ_BOOTSTRAP_PASSWORD must be set in .env}"
      RABBITMQ_WALLET_PASSWORD: "${RABBITMQ_WALLET_PASSWORD:?RABBITMQ_WALLET_PASSWORD must be set in .env}"
      RABBITMQ_INVENTORY_PASSWORD: "${RABBITMQ_INVENTORY_PASSWORD:?RABBITMQ_INVENTORY_PASSWORD must be set in .env}"
      RABBITMQ_MARKETPLACE_PASSWORD: "${RABBITMQ_MARKETPLACE_PASSWORD:?RABBITMQ_MARKETPLACE_PASSWORD must be set in .env}"
      RABBITMQ_ADMIN_PASSWORD: "${RABBITMQ_ADMIN_PASSWORD:?RABBITMQ_ADMIN_PASSWORD must be set in .env}"
    volumes:
      - ./infrastructure/rabbitmq/init-rabbitmq.sh:/init/init-rabbitmq.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - 'apk add --no-cache curl >/dev/null && tr -d "\r" < /init/init-rabbitmq.sh > /tmp/init-rabbitmq.sh && sh /tmp/init-rabbitmq.sh'
    networks:
      - marketplace-network

  auth-api:
    build:
      context: .
      dockerfile: src/Services/Auth.API/Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AuthDb;User Id=auth_runtime;Password=${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set in .env};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Issuer: "marketplace-auth"
      Jwt__Audience: "marketplace-api"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}"
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "7"
      Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Database__AutoMigrate: "true"
      Seed__Enabled: "true"
      Seed__DefaultPassword: "${AUTH_SEED_PASSWORD:-}"
    networks:
      - marketplace-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q "200"'''
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  marketplace-network:
    name: marketplace-network
    driver: bridge

volumes:
  sqlserver-data:
  mongodb-data:
  redis-data:
  rabbitmq-data:
