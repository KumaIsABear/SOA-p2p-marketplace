services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?SQL_SA_PASSWORD must be set in .env}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - marketplace-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?SQL_SA_PASSWORD must be set in .env}"
      AUTH_DB_PASSWORD: "${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set in .env}"
      WALLET_DB_PASSWORD: "${WALLET_DB_PASSWORD:?WALLET_DB_PASSWORD must be set in .env}"
      INVENTORY_DB_PASSWORD: "${INVENTORY_DB_PASSWORD:?INVENTORY_DB_PASSWORD must be set in .env}"
      MARKETPLACE_DB_PASSWORD: "${MARKETPLACE_DB_PASSWORD:?MARKETPLACE_DB_PASSWORD must be set in .env}"
      ADMIN_DB_PASSWORD: "${ADMIN_DB_PASSWORD:?ADMIN_DB_PASSWORD must be set in .env}"
    volumes:
      - ./infrastructure/sql/init-databases.sql:/init/init-databases.sql:ro
    entrypoint:
      - /bin/bash
      - -euo
      - pipefail
      - -c
      - |
        SQLCMDPASSWORD="$$SQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver,1433 -U sa -C -b \
          -v AUTH_DB_PASSWORD="$$AUTH_DB_PASSWORD" \
          -v WALLET_DB_PASSWORD="$$WALLET_DB_PASSWORD" \
          -v INVENTORY_DB_PASSWORD="$$INVENTORY_DB_PASSWORD" \
          -v MARKETPLACE_DB_PASSWORD="$$MARKETPLACE_DB_PASSWORD" \
          -v ADMIN_DB_PASSWORD="$$ADMIN_DB_PASSWORD" \
          -i /init/init-databases.sql
    networks:
      - marketplace-network

  mongodb:
    image: mongo:8.0-noble
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in .env}"
      MONGO_INITDB_DATABASE: "MarketplaceReadDb"
      MONGO_MARKETPLACE_PASSWORD: "${MONGO_MARKETPLACE_PASSWORD:?MONGO_MARKETPLACE_PASSWORD must be set in .env}"
    volumes:
      - mongodb-data:/data/db
      - ./infrastructure/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/01-init-mongo.js:ro
    networks:
      - marketplace-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok" | grep -q 1'
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"
    command:
      - /bin/sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis-data:/data
    networks:
      - marketplace-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "rabbitmq_admin"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_BOOTSTRAP_PASSWORD:?RABBITMQ_BOOTSTRAP_PASSWORD must be set in .env}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - marketplace-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'rabbitmq-diagnostics -q check_port_connectivity'
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s

  rabbitmq-init:
    image: alpine:3.21
    restart: "no"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_BOOTSTRAP_PASSWORD: "${RABBITMQ_BOOTSTRAP_PASSWORD:?RABBITMQ_BOOTSTRAP_PASSWORD must be set in .env}"
      RABBITMQ_WALLET_PASSWORD: "${RABBITMQ_WALLET_PASSWORD:?RABBITMQ_WALLET_PASSWORD must be set in .env}"
      RABBITMQ_INVENTORY_PASSWORD: "${RABBITMQ_INVENTORY_PASSWORD:?RABBITMQ_INVENTORY_PASSWORD must be set in .env}"
      RABBITMQ_MARKETPLACE_PASSWORD: "${RABBITMQ_MARKETPLACE_PASSWORD:?RABBITMQ_MARKETPLACE_PASSWORD must be set in .env}"
      RABBITMQ_ADMIN_PASSWORD: "${RABBITMQ_ADMIN_PASSWORD:?RABBITMQ_ADMIN_PASSWORD must be set in .env}"
    volumes:
      - ./infrastructure/rabbitmq/init-rabbitmq.sh:/init/init-rabbitmq.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - 'apk add --no-cache curl >/dev/null && tr -d "\r" < /init/init-rabbitmq.sh > /tmp/init-rabbitmq.sh && sh /tmp/init-rabbitmq.sh'
    networks:
      - marketplace-network

  auth-api:
    build:
      context: .
      dockerfile: src/Services/Auth.API/Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AuthDb;User Id=auth_runtime;Password=${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set in .env};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Issuer: "marketplace-auth"
      Jwt__Audience: "marketplace-api"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}"
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "7"
      Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Database__AutoMigrate: "true"
      Seed__Enabled: "true"
      Seed__DefaultPassword: "${AUTH_SEED_PASSWORD:-}"
      ServiceAuth__AllowedCallers__gateway__Key: "${SERVICE_KEY_GATEWAY:?SERVICE_KEY_GATEWAY must be set in .env}"
      ServiceAuth__AllowedCallers__marketplace__Key: "${SERVICE_KEY_MARKETPLACE:?SERVICE_KEY_MARKETPLACE must be set in .env}"
      ServiceAuth__AllowedCallers__admin__Key: "${SERVICE_KEY_ADMIN:?SERVICE_KEY_ADMIN must be set in .env}"
    networks:
      - marketplace-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q "200"'''
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  wallet-api:
    build:
      context: .
      dockerfile: src/Services/Wallet.API/Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=WalletDb;User Id=wallet_runtime;Password=${WALLET_DB_PASSWORD:?WALLET_DB_PASSWORD must be set in .env};Encrypt=True;TrustServerCertificate=True;"
      Database__AutoMigrate: "true"
      Jwt__Issuer: "marketplace-auth"
      Jwt__Audience: "marketplace-api"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "marketplace"
      RabbitMq__Username: "wallet_service"
      RabbitMq__Password: "${RABBITMQ_WALLET_PASSWORD:?RABBITMQ_WALLET_PASSWORD must be set in .env}"
      ServiceAuth__AllowedCallers__marketplace__Key: "${SERVICE_KEY_MARKETPLACE:?SERVICE_KEY_MARKETPLACE must be set in .env}"
      ServiceAuth__AllowedCallers__admin__Key: "${SERVICE_KEY_ADMIN:?SERVICE_KEY_ADMIN must be set in .env}"
      ZaloPay__BaseUrl: "http://zalopay-mock:9999"
      ZaloPay__AppId: "${ZALOPAY_APP_ID:-0}"
      ZaloPay__Key1: "${ZALOPAY_KEY1:-}"
      ZaloPay__Key2: "${ZALOPAY_KEY2:-}"
      ZaloPay__CallbackUrl: "${ZALOPAY_CALLBACK_URL:-}"
      ZaloPay__ReconcileIntervalSeconds: "60"
      ZaloPay__OrderExpiryMinutes: "15"
      ZaloPay__ReconciliationEnabled: "true"
    networks:
      - marketplace-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q "200"'''
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  inventory-api:
    build:
      context: .
      dockerfile: src/Services/Inventory.API/Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=InventoryDb;User Id=inventory_runtime;Password=${INVENTORY_DB_PASSWORD:?INVENTORY_DB_PASSWORD must be set in .env};Encrypt=True;TrustServerCertificate=True;"
      Database__AutoMigrate: "true"
      Seed__Enabled: "true"
      Inventory__DefaultCapacity: "20"
      Jwt__Issuer: "marketplace-auth"
      Jwt__Audience: "marketplace-api"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "marketplace"
      RabbitMq__Username: "inventory_service"
      RabbitMq__Password: "${RABBITMQ_INVENTORY_PASSWORD:?RABBITMQ_INVENTORY_PASSWORD must be set in .env}"
      ServiceAuth__AllowedCallers__seeder__Key: "${SERVICE_KEY_SEEDER:?SERVICE_KEY_SEEDER must be set in .env}"
      ServiceAuth__AllowedCallers__marketplace__Key: "${SERVICE_KEY_MARKETPLACE:?SERVICE_KEY_MARKETPLACE must be set in .env}"
      ServiceAuth__AllowedCallers__admin__Key: "${SERVICE_KEY_ADMIN:?SERVICE_KEY_ADMIN must be set in .env}"
    networks:
      - marketplace-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q "200"'''
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  marketplace-api:
    build:
      context: .
      dockerfile: src/Services/Marketplace.API/Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=MarketplaceWriteDb;User Id=marketplace_runtime;Password=${MARKETPLACE_DB_PASSWORD:?MARKETPLACE_DB_PASSWORD must be set in .env};Encrypt=True;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"
      Database__AutoMigrate: "true"
      Jwt__Issuer: "marketplace-auth"
      Jwt__Audience: "marketplace-api"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}"
      Economy__FeeBasisPoints: "500"
      Economy__ListingLockTtlSeconds: "20"
      InternalServices__ServiceKey: "${SERVICE_KEY_MARKETPLACE:?SERVICE_KEY_MARKETPLACE must be set in .env}"
      InternalServices__AuthBaseUrl: "http://auth-api:8080"
      InternalServices__InventoryBaseUrl: "http://inventory-api:8080"
      InternalServices__AdminBaseUrl: "http://admin-api:8080"
      InternalServices__WalletBaseUrl: "http://wallet-api:8080"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "marketplace"
      RabbitMq__Username: "marketplace_service"
      RabbitMq__Password: "${RABBITMQ_MARKETPLACE_PASSWORD:?RABBITMQ_MARKETPLACE_PASSWORD must be set in .env}"
      MongoDb__ConnectionString: "mongodb://marketplace_runtime:${MONGO_MARKETPLACE_PASSWORD:?MONGO_MARKETPLACE_PASSWORD must be set in .env}@mongodb:27017/MarketplaceReadDb?authSource=MarketplaceReadDb"
      MongoDb__DatabaseName: "MarketplaceReadDb"
      MongoDb__CatalogCollectionName: "Marketplace_Catalog"
      ServiceAuth__AllowedCallers__admin__Key: "${SERVICE_KEY_ADMIN:?SERVICE_KEY_ADMIN must be set in .env}"
    networks:
      - marketplace-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q "200"'''
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  admin-api:
    build:
      context: .
      dockerfile: src/Services/Admin.API/Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AdminAnalyticsDb;User Id=admin_runtime;Password=${ADMIN_DB_PASSWORD:?ADMIN_DB_PASSWORD must be set in .env};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Issuer: "marketplace-auth"
      Jwt__Audience: "marketplace-api"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "marketplace"
      RabbitMq__Username: "admin_service"
      RabbitMq__Password: "${RABBITMQ_ADMIN_PASSWORD:?RABBITMQ_ADMIN_PASSWORD must be set in .env}"
      Economy__DefaultBandBps: "2000"
      Analytics__TimeZoneId: "Asia/Ho_Chi_Minh"
      Analytics__DailySummaryTime: "00:00"
      Services__Auth__BaseUrl: "http://auth-api:8080"
      Services__Wallet__BaseUrl: "http://wallet-api:8080"
      Services__Inventory__BaseUrl: "http://inventory-api:8080"
      Services__Marketplace__BaseUrl: "http://marketplace-api:8080"
      Services__TimeoutSeconds: "5"
      Database__AutoMigrate: "true"
      Seed__Enabled: "true"
      ServiceAuth__OutgoingKey: "${SERVICE_KEY_ADMIN:?SERVICE_KEY_ADMIN must be set in .env}"
      ServiceAuth__AllowedCallers__marketplace__Key: "${SERVICE_KEY_MARKETPLACE:?SERVICE_KEY_MARKETPLACE must be set in .env}"
    networks:
      - marketplace-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q "200"'''
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Gateway.API/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth-api:
        condition: service_healthy
      wallet-api:
        condition: service_healthy
      inventory-api:
        condition: service_healthy
      marketplace-api:
        condition: service_healthy
      admin-api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      Jwt__Issuer: "marketplace-auth"
      Jwt__Audience: "marketplace-api"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}"
      Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Services__Auth__BaseUrl: "http://auth-api:8080"
      Services__Wallet__BaseUrl: "http://wallet-api:8080"
      Services__Inventory__BaseUrl: "http://inventory-api:8080"
      Services__Marketplace__BaseUrl: "http://marketplace-api:8080"
      Services__Admin__BaseUrl: "http://admin-api:8080"
      ServiceAuth__OutgoingKey: "${SERVICE_KEY_GATEWAY:?SERVICE_KEY_GATEWAY must be set in .env}"
      Cors__AllowedOrigins__0: "http://localhost:5500"
      Cors__AllowedOrigins__1: "http://127.0.0.1:5500"
      Cors__AllowedOrigins__2: "http://localhost:8080"
      Cors__AllowedOrigins__3: "http://127.0.0.1:8080"
    networks:
      - marketplace-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q "200"'''
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      gateway:
        condition: service_healthy
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - marketplace-network
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/dashboards/marketplace-overview.json"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - marketplace-network
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  marketplace-network:
    name: marketplace-network
    driver: bridge

volumes:
  sqlserver-data:
  mongodb-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
